[pytest]
# Collect ONLY tests/. Without this a bare `pytest` at the repo root also walks
# evidence/nxb-009/codex-implementation/, the archived blind Codex build from
# nxb-009, which carries its own tests/ and cannot import outside its original
# directory. That is an artefact, not a test target.
testpaths = tests

# Registered so `-m "not spawns_children"` is a supported, discoverable target
# rather than folklore. See tests/adapter_conformance.py for why the split
# exists: a red suite must mean a defect, and a suite whose verdict depends on
# how busy the machine is cannot promise that.
markers =
    spawns_children: spawns real child PROCESSES (/bin/sh scripts, never a real
        runtime binary, never any tokens) and waits on real deadlines. Slower,
        and the only tests here whose verdict machine load can influence. Run the
        fast, load-insensitive signal with:  pytest -m "not spawns_children"
